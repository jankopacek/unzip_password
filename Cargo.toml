[package]
name = "rentgeny"
version = "0.1.0"
edition = "2024"

[features]
# Build without the GUI (`cargo build --no-default-features`) for a CLI-only binary.
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
eframe = { version = "0.37.0", optional = true, features = ["persistence"] }
rfd = { version = "0.17.2", optional = true }
zip = "9.4.1"

[dev-dependencies]
tempfile = "3.27.0"

# Keep dev builds small: line tables only for this crate, no debuginfo for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
